openapi: 3.0.3
info:
  title: 心理AI助手后端接口
  version: 1.0.0
  description: AI Psychological Assistant System 后端接口文档，适用于 Apifox / Swagger 导入。
servers:
  - url: http://localhost:8080/api
    description: 本地环境
  - url: http://你的服务器地址/api
    description: 宝塔线上环境
tags:
  - name: 用户认证
  - name: 用户管理
  - name: 知识库
  - name: 文件上传
  - name: 情绪日志
  - name: 咨询记录
  - name: 数据分析
security:
  - bearerAuth: []
paths:
  /user/login:
    post:
      tags: [用户认证]
      summary: 用户登录
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              username: admin
              password: "123456"
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
  /user/register:
    post:
      tags: [用户认证]
      summary: 用户注册
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              username: student01
              password: "123456"
              email: student01@example.com
      responses:
        "200":
          description: 注册成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
  /user/admin:
    post:
      tags: [用户管理]
      summary: 超级管理员创建管理员
      description: 需要 SUPER_ADMIN token。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              username: admin02
              password: "123456"
              email: admin02@example.com
      responses:
        "200":
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
  /user/profile:
    get:
      tags: [用户管理]
      summary: 获取当前用户资料
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
    put:
      tags: [用户管理]
      summary: 修改当前用户资料
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdateRequest'
            example:
              nickname: 小明
              email: student01@example.com
              age: 20
              gender: male
              avatar: /api/uploads/2026/06/22/avatar.jpg
      responses:
        "200":
          description: 修改成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
  /user/password:
    put:
      tags: [用户管理]
      summary: 修改当前用户密码
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordUpdateRequest'
            example:
              oldPassword: "123456"
              newPassword: "654321"
      responses:
        "200":
          description: 修改成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
  /user/email:
    put:
      tags: [用户管理]
      summary: 修改当前用户邮箱
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailUpdateRequest'
            example:
              email: new-email@example.com
      responses:
        "200":
          description: 修改成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
  /user/password/reset-code:
    post:
      tags: [用户认证]
      summary: 发送邮箱重置密码验证码
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetCodeRequest'
            example:
              email: student01@example.com
      responses:
        "200":
          description: 发送成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
  /user/password/reset:
    put:
      tags: [用户认证]
      summary: 邮箱验证码重置密码
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
            example:
              email: student01@example.com
              code: "123456"
              newPassword: "654321"
      responses:
        "200":
          description: 重置成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
  /user/logout:
    post:
      tags: [用户认证]
      summary: 退出登录
      responses:
        "200":
          description: 退出成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
  /knowledge/category/tree:
    get:
      tags: [知识库]
      summary: 获取知识分类
      security: []
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResult'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/KnowledgeCategory'
  /knowledge/article/page:
    get:
      tags: [知识库]
      summary: 分页查询文章
      security: []
      parameters:
        - name: currentPage
          in: query
          schema: { type: integer, default: 1 }
          description: 当前页
        - name: size
          in: query
          schema: { type: integer, default: 10 }
          description: 每页数量
        - name: title
          in: query
          schema: { type: string }
          description: 标题模糊查询
        - name: categoryId
          in: query
          schema: { type: integer, format: int64 }
          description: 分类 ID
        - name: status
          in: query
          schema: { type: integer, enum: [0, 1, 2] }
          description: 文章状态：0 草稿，1 已发布，2 已下线
        - name: sortField
          in: query
          schema: { type: string, enum: [readCount, publishedAt] }
          description: 排序字段
        - name: sortDirection
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
          description: 排序方向
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticlePageResponse'
  /knowledge/article:
    post:
      tags: [知识库]
      summary: 新增文章
      description: 需要 ADMIN 或 SUPER_ADMIN token。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KnowledgeArticle'
            example:
              title: 考试焦虑的调节方法
              categoryId: 101
              summary: 介绍考试焦虑的识别和缓解方法。
              content: <p>正文内容</p>
              coverImg: /uploads/2026/06/22/cover.jpg
              tags: 焦虑,考试,心理健康
              status: 0
      responses:
        "200":
          description: 新增成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleResponse'
  /knowledge/article/{id}:
    get:
      tags: [知识库]
      summary: 获取文章详情
      security: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleResponse'
    put:
      tags: [知识库]
      summary: 更新文章
      description: 需要 ADMIN 或 SUPER_ADMIN token。
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KnowledgeArticle'
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleResponse'
    delete:
      tags: [知识库]
      summary: 删除文章
      description: 需要 ADMIN 或 SUPER_ADMIN token。
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        "200":
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
  /knowledge/article/{id}/status:
    put:
      tags: [知识库]
      summary: 更新文章状态
      description: 需要 ADMIN 或 SUPER_ADMIN token。
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticleStatusRequest'
            example:
              status: 1
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
  /file/upload:
    post:
      tags: [文件上传]
      summary: 上传文件
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, businessType]
              properties:
                file:
                  type: string
                  format: binary
                  description: 上传文件
                businessType:
                  type: string
                  example: ARTICLE
                businessId:
                  type: string
                  example: "1001"
                businessField:
                  type: string
                  example: cover
      responses:
        "200":
          description: 上传成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileUploadResponse'
  /emotion-diary:
    post:
      tags: [情绪日志]
      summary: 新增情绪日志
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmotionDiaryRequest'
            example:
              diaryDate: "2026-06-22"
              moodScore: 6
              dominantEmotion: 焦虑
              sleepQuality: 3
              stressLevel: 4
              emotionTriggers: 考试临近
              diaryContent: 今天复习效率不高，有些担心。
      responses:
        "200":
          description: 新增成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmotionDiaryResponse'
  /emotion-diary/admin/page:
    get:
      tags: [情绪日志]
      summary: 管理端分页查询情绪日志
      description: 需要 ADMIN 或 SUPER_ADMIN token。
      parameters:
        - name: current
          in: query
          schema: { type: integer, default: 1 }
        - name: size
          in: query
          schema: { type: integer, default: 10 }
        - name: userId
          in: query
          schema: { type: integer, format: int64 }
        - name: moodScore
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmotionDiaryPageResponse'
  /emotion-diary/admin/{id}:
    delete:
      tags: [情绪日志]
      summary: 删除情绪日志
      description: 需要 ADMIN 或 SUPER_ADMIN token。
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        "200":
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
  /psychological-chat/sessions:
    get:
      tags: [咨询记录]
      summary: 分页查询咨询会话
      description: 需要 ADMIN 或 SUPER_ADMIN token。
      parameters:
        - name: currentPage
          in: query
          schema: { type: integer, default: 1 }
        - name: size
          in: query
          schema: { type: integer, default: 10 }
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSessionPageResponse'
  /psychological-chat/sessions/{sessionId}/messages:
    get:
      tags: [咨询记录]
      summary: 查询会话消息
      description: 需要 ADMIN 或 SUPER_ADMIN token。
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResult'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/PsychologicalChatMessage'
  /data-analytics/overview:
    get:
      tags: [数据分析]
      summary: 综合数据概览
      description: 需要 ADMIN 或 SUPER_ADMIN token。
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsOverviewResponse'
  /data-analytics/emotion-trend:
    get:
      tags: [数据分析]
      summary: 近 7 天情绪趋势
      description: 需要 ADMIN 或 SUPER_ADMIN token。
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrendResponse'
  /data-analytics/chat-stats:
    get:
      tags: [数据分析]
      summary: 咨询统计
      description: 需要 ADMIN 或 SUPER_ADMIN token。
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatStatsResponse'
  /data-analytics/knowledge-stats:
    get:
      tags: [数据分析]
      summary: 知识库统计
      description: 需要 ADMIN 或 SUPER_ADMIN token。
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeStatsResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 填写登录接口返回的 JWT。Apifox 中可设置为 Bearer {{token}}。
  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: 主键 ID
  schemas:
    ApiResult:
      type: object
      properties:
        code:
          type: integer
          example: 200
        msg:
          type: string
          example: success
        data:
          nullable: true
    EmptyResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResult'
        - type: object
          properties:
            data:
              nullable: true
              example: null
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
    RegisterRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 20
        password:
          type: string
          minLength: 6
        email:
          type: string
          format: email
    PasswordUpdateRequest:
      type: object
      required: [oldPassword, newPassword]
      properties:
        oldPassword:
          type: string
        newPassword:
          type: string
    EmailUpdateRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
    PasswordResetCodeRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
    PasswordResetRequest:
      type: object
      required: [email, code, newPassword]
      properties:
        email:
          type: string
          format: email
        code:
          type: string
        newPassword:
          type: string
          minLength: 6
    ProfileUpdateRequest:
      type: object
      properties:
        username:
          type: string
        nickname:
          type: string
        email:
          type: string
        age:
          type: integer
        gender:
          type: string
        avatar:
          type: string
    UserProfile:
      type: object
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
        nickname: { type: string }
        email: { type: string }
        phone: { type: string, nullable: true }
        age: { type: integer, nullable: true }
        gender: { type: string, nullable: true }
        avatar: { type: string, nullable: true }
        avatarUrl: { type: string, nullable: true }
        role:
          type: string
          enum: [USER, ADMIN, SUPER_ADMIN]
        roleType:
          type: integer
          enum: [1, 2]
    LoginResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResult'
        - type: object
          properties:
            data:
              type: object
              properties:
                token:
                  type: string
                userInfo:
                  $ref: '#/components/schemas/UserProfile'
    ProfileResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResult'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/UserProfile'
    KnowledgeCategory:
      type: object
      properties:
        id: { type: integer, format: int64 }
        parentId: { type: integer, format: int64, nullable: true }
        name: { type: string }
        categoryName: { type: string }
        code: { type: string }
        description: { type: string }
        sortOrder: { type: integer }
        status: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        deleted: { type: integer }
    KnowledgeArticle:
      type: object
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        categoryId: { type: integer, format: int64 }
        authorId: { type: integer, format: int64 }
        authorName: { type: string }
        summary: { type: string }
        content: { type: string }
        coverImg: { type: string }
        tags: { type: string }
        status:
          type: integer
          enum: [0, 1, 2]
        readCount: { type: integer }
        publishedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        deleted: { type: integer }
    ArticleStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: integer
          enum: [0, 1, 2]
          description: 0 草稿，1 发布，2 下线
    ArticleResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResult'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/KnowledgeArticle'
    ArticlePageResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResult'
        - type: object
          properties:
            data:
              type: object
              properties:
                records:
                  type: array
                  items:
                    $ref: '#/components/schemas/KnowledgeArticle'
                total: { type: integer }
                size: { type: integer }
                current: { type: integer }
                pages: { type: integer }
    FileUploadResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResult'
        - type: object
          properties:
            data:
              type: object
              properties:
                id: { type: integer, format: int64 }
                filePath: { type: string }
                fileUrl: { type: string }
                url: { type: string }
                originalName: { type: string }
    EmotionDiaryRequest:
      type: object
      required: [moodScore]
      properties:
        diaryDate: { type: string, format: date }
        moodScore:
          type: integer
          minimum: 1
          maximum: 10
        dominantEmotion: { type: string }
        sleepQuality: { type: integer }
        stressLevel: { type: integer }
        emotionTriggers: { type: string }
        diaryContent: { type: string }
    EmotionDiary:
      type: object
      properties:
        id: { type: integer, format: int64 }
        userId: { type: integer, format: int64 }
        username: { type: string }
        nickname: { type: string }
        diaryDate: { type: string, format: date }
        moodScore: { type: integer }
        dominantEmotion: { type: string }
        sleepQuality: { type: integer }
        stressLevel: { type: integer }
        emotionTriggers: { type: string }
        diaryContent: { type: string }
        aiEmotionAnalysis: { type: string }
        mainEmotion: { type: string }
        intensity: { type: integer }
        riskLevel: { type: string }
        sentiment: { type: string }
        analysisResult: { type: string }
        suggestion: { type: string }
        improvementSuggestions:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    EmotionDiaryResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResult'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/EmotionDiary'
    EmotionDiaryPageResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResult'
        - type: object
          properties:
            data:
              type: object
              properties:
                records:
                  type: array
                  items:
                    $ref: '#/components/schemas/EmotionDiary'
                total: { type: integer }
                size: { type: integer }
                current: { type: integer }
                pages: { type: integer }
    PsychologicalChatSession:
      type: object
      properties:
        id: { type: integer, format: int64 }
        userId: { type: integer, format: int64 }
        userNickname: { type: string }
        sessionTitle: { type: string }
        lastMessageContent: { type: string }
        messageCount: { type: integer }
        startedAt: { type: string, format: date-time }
        lastMessageTime: { type: string, format: date-time }
        status: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PsychologicalChatMessage:
      type: object
      properties:
        id: { type: integer, format: int64 }
        sessionId: { type: integer, format: int64 }
        senderType:
          type: integer
          description: 1 用户，2 AI，3 系统
        content: { type: string }
        modelName: { type: string }
        promptTokens: { type: integer }
        completionTokens: { type: integer }
        createdAt: { type: string, format: date-time }
    ChatSessionPageResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResult'
        - type: object
          properties:
            data:
              type: object
              properties:
                records:
                  type: array
                  items:
                    $ref: '#/components/schemas/PsychologicalChatSession'
                total: { type: integer }
                size: { type: integer }
                current: { type: integer }
                pages: { type: integer }
    AnalyticsOverviewResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResult'
        - type: object
          properties:
            data:
              type: object
              properties:
                systemOverview:
                  type: object
                consultationStats:
                  type: object
                emotionTrend:
                  type: array
                  items: { type: object }
                consultationTrend:
                  type: array
                  items: { type: object }
                knowledgeStats:
                  type: object
    TrendResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResult'
        - type: object
          properties:
            data:
              type: array
              items:
                type: object
                properties:
                  date: { type: string }
                  avgMoodScore: { type: number }
